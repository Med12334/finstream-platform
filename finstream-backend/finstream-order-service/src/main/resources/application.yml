server:
  port: 8081

spring:
  application:
    name: finstream-order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/finstream_oltp
    username: finstream_user
    password: finstream_secret
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true

app:
  kafka:
    topics:
      order-inbound: orders.inbound.v1
