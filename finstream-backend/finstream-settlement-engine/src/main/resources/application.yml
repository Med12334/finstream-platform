server:
  port: 8082

spring:
  application:
    name: finstream-settlement-engine
  datasource:
    url: jdbc:db2://localhost:50000/FINLEDGR
    username: db2inst1
    password: FinStreamDB2Password2026!
    driver-class-name: com.ibm.db2.jcc.DB2Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.DB2Dialect
        format_sql: true
    show-sql: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: finstream-settlement-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.finstream.common.event"

app:
  kafka:
    topics:
      order-inbound: orders.inbound.v1
