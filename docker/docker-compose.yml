version: '3.8'

services:
  # Operational Database
  postgres:
    image: postgres:16-alpine
    container_name: finstream-postgres
    environment:
      POSTGRES_DB: finstream_oltp
      POSTGRES_USER: finstream_user
      POSTGRES_PASSWORD: finstream_secret
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finstream_user -d finstream_oltp"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Regulatory Compliance Ledger
  ibm-db2:
    image: icr.io/db2_community/db2:11.5.8.0
    container_name: finstream-db2
    privileged: true
    environment:
      DB2INSTANCE: db2inst1
      DB2INST1_PASSWORD: FinStreamDB2Password2026!
      DBNAME: FINLEDGR
      BLU: "false"
      ENABLE_ORACLE_COMPATIBILITY: "false"
      AUTOCONFIG: "false"
    ports:
      - "50000:50000"
    volumes:
      - ./db2/init-scripts:/var/custom

  # Apache Kafka (KRaft mode)
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: finstream-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'

  # Web UI for Kafka Topics & Messages
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: finstream-kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: finstream-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
